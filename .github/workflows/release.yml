# Packages Circlet and uploads it to CurseForge (and as a GitHub release) whenever a version
# tag is pushed: git tag v0.62.0 && git push origin v0.62.0
#
# Needs, once:
#   - the CurseForge project ID in Circlet.toc (## X-Curse-Project-ID, set)
#   - a CurseForge API token as the repository secret CF_API_KEY
#     (CurseForge: profile > My API Tokens; GitHub: Settings > Secrets and variables > Actions)
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    # A fixed image and Python, so a new ubuntu-latest (Ubuntu 26 from October 2026) can't
    # change the tests' Python and its packages under a release.
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub release
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager reads tags for the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core # the image tests label their renders
          python -m pip install lupa pillow
          python -c "import sys, lupa, PIL; print(sys.version, 'lupa', lupa.__version__, 'pillow', PIL.__version__)"
          python tests/run_tests.py

      - name: Package and upload
        uses: BigWigsMods/packager@v2
